<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="utf-8" />
    <title>西藏交发集团 - 统一身份认证登录页</title>

    <meta name="description" content="西藏交发集团统一身份认证登录页" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <link type="images/x-icon" rel="shortcut icon" href="${request.contextPath}/static/custom/assets/favicon.ico">

    <script type="text/javascript">
        var url = window.location.href;
        if (url.indexOf('/sso/login') === -1) {
            window.location.href = '${request.contextPath}/sso/login';
        }
    </script>

    <!-- bootstrap & fontawesome -->
    <link rel="stylesheet" href="${request.contextPath}/static/assets/css/bootstrap.css" />
    <link rel="stylesheet" href="${request.contextPath}/static/assets/css/loginForm.css" />
    <link rel="stylesheet" href="${request.contextPath}/static/assets/css/font-awesome.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <!-- text fonts -->
    <link rel="stylesheet" href="${request.contextPath}/static/assets/css/ace-fonts.css" />

    <!-- ace styles -->
    <link rel="stylesheet" href="${request.contextPath}/static/assets/css/ace.css" />

    <!--[if lte IE 9]>
    <link rel="stylesheet" href="${request.contextPath}/static/assets/css/ace-part2.css"/>
    <![endif]-->
    <link rel="stylesheet" href="${request.contextPath}/static/assets/css/ace-rtl.css" />

    <!--[if lte IE 9]>
    <link rel="stylesheet" href="${request.contextPath}/static/assets/css/ace-ie.css"/>
    <![endif]-->

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->

    <!--[if lt IE 9]>
    <script src="${request.contextPath}/static/assets/js/html5shiv.js"></script>
    <script src="${request.contextPath}/static/assets/js/respond.js"></script>
    <![endif]-->

    <style>
        /* 忘记密码按钮悬停效果 */
        #verifyIdentityBtn:hover {
            background: #3A7BD5 !important;
        }
    </style>
</head>

<body>
    <div class="login_con">
        <!-- 背景图片 -->
        <div class="background-image"></div>

        <!-- 左上角Logo和标题 -->
        <div class="header-section">
            <div class="logo-container">
                <div class="logo"></div>
            </div>
        </div>

        <!-- 登录表单 -->
        <div class="login-form-container">
            <div class="login-form">
                <!-- 表单标题 -->
                <div class="form-header">
                    <h2 class="welcome-text">欢迎使用交发平台</h2>
                    <div id="loginMethod" class="login-method">账号登录</div>
                </div>

                <!-- 二维码图标 -->
                <div id="qr" class="qr-code-icon" title="切换到扫码登录">
                    <img src="../../static/assets/img/login-qr.png" alt="二维码登录"
                        style="width:72px; height:72px; cursor:pointer;">
                </div>


                <!-- 登录表单 -->
                <form id="_loginForm" action="${request.contextPath}/sso/login" method="post" validate="true"
                    vmessage="false">
                    <input type="hidden" name="redirectUri" value="${redirectUri}" />
                    <input type="hidden" name="clientId" value="${clientId}" />

                    <!-- 用户名输入框 -->
                    <div class="form-user">
                        <label>
                            <img src="../../static/assets/img/login-user.png" alt="用户名"
                                style="width: 16px; height: 16px; margin-right: 8px; vertical-align: middle;">
                            <input id="_username" name="username" value="" type="text" placeholder="账号" required="true"
                                minlength='2' />
                        </label>
                    </div>

                    <!-- 密码输入框 -->
                    <div class="form-password">
                        <label>
                            <img src="../../static/assets/img/login-password.png" alt="密码"
                                style="width: 16px; height: 16px; margin-right: 8px; vertical-align: middle;">
                            <input id="_password" name="password" value="" type="password" placeholder="密码"
                                onkeydown="if(event.keyCode===13){event.preventDefault();$('#_loginButton').click();}"
                                required="true" minlength='6' maxlength='16' />
                            <img id="togglePasswordImg" src="../../static/assets/img/login-noVisible.png" alt=""
                                style="width: 16px; height: 16px; margin-right: 8px; vertical-align: middle;">
                        </label>
                    </div>

                    <!-- 记住密码复选框和忘记密码链接 -->
                    <div class="form-checkbox"
                        style="display: flex; justify-content: space-between; align-items: center;">
                        <label>
                            <input id="_rememberMe" type="checkbox" />
                            <span>记住密码</span>
                        </label>
                        <a href="javascript:void(0);" id="_forgotPassword"
                            style="color: #007BFF; font-size: 14px; text-decoration: none; cursor: pointer;">忘记密码?</a>
                    </div>

                    <!-- 登录按钮 -->
                    <button id="_loginButton" type="button">
                        <span>登录</span>
                    </button>
                </form>
                <!-- 二维码登录区域（默认隐藏） -->
                <div id="qrLoginContainer" style="text-align:center; display:none;">
                    <div id="qrCodeContainer" style="position:relative; display:inline-block;">
                        <img id="qrCodeImage" src="" alt="扫码登录二维码"
                            style="width:276px; height:276px; border:1px solid #ddd; border-radius:8px; margin:10px 0;">

                        <!-- 过期覆盖层（默认隐藏） -->
                        <div id="qrExpiredOverlay" style="position:absolute; top:10px; left:0; right:0; bottom:10px;
                         background:rgba(0,0,0,0.7); border-radius:8px; display:none;
                         justify-content:center; align-items:center; flex-direction:column; cursor:pointer;">
                            <div style="color:white; text-align:center;">
                                <i class="fa fa-refresh" style="font-size:32px; margin-bottom:10px;"></i>
                                <div style="font-size:16px; font-weight:bold; margin-bottom:5px;">二维码已过期</div>
                                <div style="font-size:12px; opacity:0.8;">点击刷新</div>
                            </div>
                        </div>
                    </div>

                    <p id="qrStatusText" style="color:#999; font-size:12px; margin-top:8px;">
                        正在加载二维码...
                    </p>

                    <div style="margin-top:10px;">
                        <a href="javascript:void(0);" id="backToAccount"
                            style="color:#007BFF; font-size:14px;">使用账号密码登录</a>
                    </div>
                </div>

                <!-- 忘记密码模态框 -->
                <div id="forgotPasswordModal"
                    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
                    <div
                        style="background:white; border-radius:12px; padding:60px 40px; width:500px; max-width:90%; box-shadow:0 4px 20px rgba(0,0,0,0.15);">
                        <h3 style="margin:0 0 25px 0; color:#333; font-size:22px; text-align:center;">忘记密码</h3>

                        <!-- 第一步:验证身份 -->
                        <div id="step1Container">
                            <p style="color:#666; font-size:14px; margin-bottom:20px; text-align:center;">
                                请输入您的姓名和身份证号码进行身份验证</p>
                            <div style="margin-bottom:15px;">
                                <label style="display:block; margin-bottom:5px; color:#555; font-size:14px;">姓名</label>
                                <input id="forgotName" type="text" placeholder="请输入姓名"
                                    style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; font-size:14px; box-sizing:border-box;">
                            </div>
                            <div style="margin-bottom:20px;">
                                <label
                                    style="display:block; margin-bottom:5px; color:#555; font-size:14px;">身份证号码</label>
                                <input id="forgotIdNumber" type="text" placeholder="请输入身份证号码" maxlength="18"
                                    style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; font-size:14px; box-sizing:border-box;">
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button id="verifyIdentityBtn"
                                    style="flex:1; padding:12px; background:#0154A1; color:white; border:none; border-radius:4px; font-size:14px; cursor:pointer; transition:background 0.3s;">验证身份</button>
                                <button id="cancelStep1Btn"
                                    style="flex:1; padding:12px; background:#6c757d; color:white; border:none; border-radius:4px; font-size:14px; cursor:pointer; transition:background 0.3s;">取消</button>
                            </div>
                        </div>

                        <!-- 第二步:重置密码 (默认隐藏) -->
                        <div id="step2Container" style="display:none;">
                            <p
                                style="color:#28a745; font-size:14px; margin-bottom:20px; text-align:center; font-weight:bold;">
                                ✓ 身份验证成功</p>
                            <div style="margin-bottom:15px;">
                                <label style="display:block; margin-bottom:5px; color:#555; font-size:14px;">新密码</label>
                                <input id="newPassword" type="password" placeholder="请输入新密码(6-16位)" maxlength="16"
                                    style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; font-size:14px; box-sizing:border-box;">
                            </div>
                            <div style="margin-bottom:20px;">
                                <label
                                    style="display:block; margin-bottom:5px; color:#555; font-size:14px;">确认密码</label>
                                <input id="confirmPassword" type="password" placeholder="请再次输入新密码" maxlength="16"
                                    style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; font-size:14px; box-sizing:border-box;">
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button id="resetPasswordBtn"
                                    style="flex:1; padding:12px; background:#28a745; color:white; border:none; border-radius:4px; font-size:14px; cursor:pointer; transition:background 0.3s;">确认修改</button>
                                <button id="cancelStep2Btn"
                                    style="flex:1; padding:12px; background:#6c757d; color:white; border:none; border-radius:4px; font-size:14px; cursor:pointer; transition:background 0.3s;">取消</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--[if !IE]> -->
    <script type="text/javascript">
        window.jQuery || document.write("<script src='${request.contextPath}/static/assets/js/jquery.js'>" + "<" + "/script>");
    </script>
    <!-- <![endif]-->

    <!--[if IE]>
<script type="text/javascript">
    window.jQuery || document.write("<script src='${request.contextPath}/static/assets/js/jquery1x.js'>"+"<"+"/script>");
</script>
<![endif]-->

    <script type="text/javascript">
        if ('ontouchstart' in document.documentElement) document.write("<script src='${request.contextPath}/static/assets/js/jquery.mobile.custom.js'>" + "<" + "/script>");
    </script>

    <script type="text/javascript" src="${request.contextPath}/static/custom/jquery.cookie.js"></script>
    <script type="text/javascript" src="${request.contextPath}/static/custom/jquery.form.min.js"></script>
    <script type="text/javascript" src="${request.contextPath}/static/custom/jquery.validate-2.0.min.js"></script>
    <script type="text/javascript"
        src="${request.contextPath}/static/custom/jquery.validate-2.0.custom.min.js"></script>
    <!-- CryptoJS for password encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <!-- inline scripts related to this page -->
    <script type="text/javascript">
        jQuery(function ($) {

            //验证是否存在错误消息（只显示一次，防止刷新时重复弹出）
            var fail = '${errorMessage!""}';
            var errorShown = sessionStorage.getItem('errorMessageShown');

            // 如果有错误消息且未显示过，则显示并标记
            if (fail != null && fail != '' && !errorShown) {
                alert(fail);
                sessionStorage.setItem('errorMessageShown', 'true');
            }

            // 清除标记（当页面不是由于错误返回时）
            if (!fail || fail == '') {
                sessionStorage.removeItem('errorMessageShown');
            }

            // 密码加密密钥（建议使用复杂的密钥，或者根据用户信息动态生成）
            var SECRET_KEY = 'XiZangJiaoFaSSO2024@Secret#Key';

            // 加密函数
            function encryptPassword(password) {
                try {
                    return CryptoJS.AES.encrypt(password, SECRET_KEY).toString();
                } catch (e) {
                    console.error('密码加密失败:', e);
                    return null;
                }
            }

            // 解密函数
            function decryptPassword(encryptedPassword) {
                try {
                    var bytes = CryptoJS.AES.decrypt(encryptedPassword, SECRET_KEY);
                    return bytes.toString(CryptoJS.enc.Utf8);
                } catch (e) {
                    console.error('密码解密失败:', e);
                    return null;
                }
            }

            // 页面加载时，从Cookie读取用户名和密码并自动填充
            var savedUsername = $.cookie('_username');
            var savedPassword = $.cookie('_password');

            console.log('读取到的Cookie用户名:', savedUsername); // 调试信息

            if (savedUsername) {
                $('#_username').val(savedUsername);
                $('#_rememberMe').prop('checked', true);
                console.log('已自动填充用户名:', savedUsername); // 调试信息

                // 如果保存了密码，解密并填充
                if (savedPassword) {
                    var decryptedPassword = decryptPassword(savedPassword);
                    if (decryptedPassword) {
                        $('#_password').val(decryptedPassword);
                        console.log('已自动填充密码'); // 调试信息
                    } else {
                        console.log('密码解密失败'); // 调试信息
                    }
                }
            } else {
                console.log('未找到保存的用户名Cookie'); // 调试信息
            }

            // 监听用户名输入框的变化
            $('#_username').on('input change', function () {
                var currentUsername = $(this).val();
                // 如果当前输入的用户名与保存的Cookie不同，取消勾选"记住密码"并清空密码
                if (savedUsername && currentUsername !== savedUsername) {
                    $('#_rememberMe').prop('checked', false);
                    $('#_password').val(''); // 清空密码框
                    console.log('用户名已更改，取消勾选记住密码并清空密码'); // 调试信息
                } else if (currentUsername === savedUsername && savedPassword) {
                    // 如果改回原来的用户名，重新勾选并填充密码
                    $('#_rememberMe').prop('checked', true);
                    var decryptedPassword = decryptPassword(savedPassword);
                    if (decryptedPassword) {
                        $('#_password').val(decryptedPassword);
                    }
                    console.log('用户名改回原值，重新勾选记住密码'); // 调试信息
                }
            });

            // 密码显示/隐藏切换（使用图片图标）
            $('#togglePasswordImg').click(function () {
                var passwordInput = $('#_password');
                var $img = $(this);  // 当前点击的 img 元素

                // 获取当前 input 的 type
                if (passwordInput.attr('type') === 'password') {
                    // 显示明文密码
                    passwordInput.attr('type', 'text');
                    // 切换为"睁眼"图标（明文可见）
                    $img.attr('src', '../../static/assets/img/login-noVisible.png');
                } else {
                    // 隐藏密码
                    passwordInput.attr('type', 'password');
                    // 切换为"闭眼"图标（密码隐藏）
                    $img.attr('src', '../../static/assets/img/login-visible.png');
                }
            });

            // 二维码相关变量
            var qrToken = null;
            var qrStatusInterval = null;
            var qrExpireTime = null;
            var qrCountdownInterval = null;

            // 获取二维码
            function getQRCode(clientId, redirectUri) {
                // 显示加载状态
                $('#qrStatusText').text('正在生成二维码...');
                $('#qrCodeImage').attr('src', '../../static/assets/img/login-qr.png');

                // 添加加载样式
                $('#qrCodeImage').css({
                    'opacity': '0.5',
                    'filter': 'blur(1px)'
                });

                console.log('开始获取二维码, clientId:', clientId, 'redirectUri:', redirectUri); // 调试信息

                $.ajax({
                    url: '${request.contextPath}/sso/qr/generate',
                    method: 'POST',
                    data: {
                        clientId: clientId,
                        redirectUri: redirectUri
                    },
                    dataType: 'json', // 明确指定返回数据类型
                    timeout: 10000, // 设置10秒超时
                    success: function (response) {
                        console.log('二维码生成响应:', response); // 调试信息
                        // 检查响应结构，根据实际返回结构调整判断条件
                        if (response && response.code === 1 && response.data) { // 根据您提供的信息，success的code是1
                            // 存储qrToken和过期时间用于后续轮询
                            qrToken = response.data.qrToken;
                            qrExpireTime = response.data.expireTime;

                            // 验证二维码图片数据
                            if (response.data.qrCodeImage && response.data.qrCodeImage.startsWith('data:image/')) {
                                // 显示二维码图片
                                $('#qrCodeImage').attr('src', response.data.qrCodeImage);

                                // 移除加载样式
                                $('#qrCodeImage').css({
                                    'opacity': '1',
                                    'filter': 'none'
                                });

                                // 隐藏过期覆盖层
                                $('#qrExpiredOverlay').hide();

                                // 更新状态文本
                                $('#qrStatusText').text('请使用手机APP扫描二维码登录');

                                // 开始倒计时
                                startQRCountdown();

                                // 开始轮询二维码状态
                                startQRStatusPolling();
                            } else {
                                console.error('二维码图片数据格式错误:', response.data.qrCodeImage);
                                $('#qrStatusText').text('二维码图片生成失败');
                                // 移除加载样式
                                $('#qrCodeImage').css({
                                    'opacity': '1',
                                    'filter': 'none'
                                });
                            }
                        } else {
                            console.error('二维码生成失败，响应格式错误:', response);
                            $('#qrStatusText').text('获取二维码失败: ' + (response && response.message ? response.message : '服务器响应格式错误'));
                            // 失败时显示默认二维码图片
                            $('#qrCodeImage').attr('src', '../../static/assets/img/login-qr.png');
                            // 移除加载样式
                            $('#qrCodeImage').css({
                                'opacity': '1',
                                'filter': 'none'
                            });
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('获取二维码失败:', { xhr: xhr, status: status, error: error, responseText: xhr.responseText }); // 调试信息
                        var errorMsg = '获取二维码失败';
                        if (status === 'timeout') {
                            errorMsg = '请求超时，请稍后重试';
                        } else if (xhr.status === 404) {
                            errorMsg = '二维码服务不可用';
                        } else if (xhr.status === 500) {
                            errorMsg = '服务器内部错误';
                        } else if (xhr.responseText) {
                            try {
                                var errorResponse = JSON.parse(xhr.responseText);
                                errorMsg = errorResponse.message || errorMsg;
                            } catch (e) {
                                // 解析失败，使用默认错误信息
                            }
                        }
                        $('#qrStatusText').text(errorMsg);
                        // 失败时显示默认二维码图片
                        $('#qrCodeImage').attr('src', '../../static/assets/img/login-qr.png');
                        // 移除加载样式
                        $('#qrCodeImage').css({
                            'opacity': '1',
                            'filter': 'none'
                        });
                    }
                });
            }

            // 开始轮询二维码状态
            function startQRStatusPolling() {
                if (qrStatusInterval) {
                    clearInterval(qrStatusInterval);
                }

                qrStatusInterval = setInterval(function () {
                    // 首先检查本地过期时间
                    if (qrExpireTime && Date.now() >= qrExpireTime) {
                        showQRExpired();
                        return;
                    }

                    if (qrToken) {
                        checkQRStatus(qrToken);
                    }
                }, 2000); // 每2秒轮询一次
            }

            // 检查二维码状态
            function checkQRStatus(qrToken) {
                $.ajax({
                    url: '${request.contextPath}/sso/qr/status',
                    method: 'GET',
                    data: {
                        qrToken: qrToken
                    },
                    success: function (response) {
                        console.log('二维码状态检查响应:', response); // 调试信息
                        // 检查响应结构，根据实际返回结构调整判断条件
                        if (response.code === 1) { // 根据您提供的信息，success的code是1
                            var status = response.data.status;
                            var message = response.data.message;

                            // 更新状态文本
                            $('#qrStatusText').text(message);

                            // 根据状态处理（注意：后端返回的是字符串状态码）
                            if (status === 'scanned') { // 已扫描
                                $('#qrStatusText').text('已扫描，请在手机上确认登录');
                            } else if (status === 'confirmed') { // 已确认
                                $('#qrStatusText').text('登录成功，正在跳转...');
                                clearInterval(qrStatusInterval);
                                // 打印返回的数据
                                console.log('二维码登录成功，返回的数据:', response.data);

                                // 如果有重定向URL，则跳转
                                if (response.data.redirectUrl) {
                                    window.location.href = response.data.redirectUrl;
                                } else if (response.data.authCode) {
                                    // 如果有授权码，可以进行后续处理
                                    handleAuthCode(response.data.authCode);
                                }
                            } else if (status === 'cancelled') { // 已取消
                                $('#qrStatusText').text('登录已取消，请重新扫码');
                                clearInterval(qrStatusInterval);
                            } else if (status === 'expired') { // 已过期
                                // 服务器端检测到过期，显示过期覆盖层
                                showQRExpired();
                            } else if (status === 'waiting') { // 等待扫码
                                $('#qrStatusText').text('请使用手机APP扫描二维码登录');
                            }
                        } else {
                            $('#qrStatusText').text('状态检查失败: ' + (response.message || response.msg || '未知错误'));
                        }
                    },
                    error: function (xhr, status, error) {
                        console.log('状态检查失败:', xhr, status, error); // 调试信息
                        $('#qrStatusText').text('状态检查失败，请稍后重试');
                    }
                });
            }

            // 处理授权码
            function handleAuthCode(authCode) {
                console.log('获得授权码: ' + authCode);

                // 获取必要的参数
                var clientId = $('input[name="clientId"]').val();
                var redirectUri = $('input[name="redirectUri"]').val();

                // 调用OAuth2接口获取access token
                $.ajax({
                    url: '${request.contextPath}/sso/oauth2/access-token',
                    method: 'POST',
                    data: {
                        grant_type: 'authorization_code',
                        code: authCode,
                        client_id: clientId,
                        redirect_uri: redirectUri
                    },
                    dataType: 'json',
                    success: function (response) {
                        console.log('获取token响应:', response);
                        if (response && response.code === 1 && response.data) {
                            // 获取token成功，跳转到重定向URI
                            var accessToken = response.data.access_token;
                            var tokenType = response.data.token_type || 'Bearer';

                            // 构建重定向URL，将token作为参数传递
                            var separator = redirectUri.indexOf('?') > -1 ? '&' : '?';
                            var finalRedirectUri = redirectUri + separator + 'access_token=' + encodeURIComponent(accessToken) + '&token_type=' + encodeURIComponent(tokenType);

                            // 如果有其他返回参数，也一并传递
                            if (response.data.expires_in) {
                                finalRedirectUri += '&expires_in=' + response.data.expires_in;
                            }
                            if (response.data.scope) {
                                finalRedirectUri += '&scope=' + encodeURIComponent(response.data.scope);
                            }

                            console.log('准备跳转到:', finalRedirectUri);
                            window.location.href = finalRedirectUri;
                        } else {
                            $('#qrStatusText').text('获取访问令牌失败: ' + (response.message || '未知错误'));
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('获取token失败:', xhr, status, error);
                        $('#qrStatusText').text('获取访问令牌失败，请重新扫码');
                    }
                });
            }

            // 刷新二维码
            function refreshQRCode() {
                // 清理当前二维码相关资源
                cleanupQRCode();

                // 重新获取二维码
                var clientId = $('input[name="clientId"]').val();
                var redirectUri = $('input[name="redirectUri"]').val();
                getQRCode(clientId, redirectUri);
            }

            // 开始倒计时（内部检测，不显示UI）
            function startQRCountdown() {
                if (qrCountdownInterval) {
                    clearInterval(qrCountdownInterval);
                }

                if (!qrExpireTime) {
                    return;
                }

                qrCountdownInterval = setInterval(function () {
                    var now = Date.now();
                    var remaining = qrExpireTime - now;

                    if (remaining <= 0) {
                        // 二维码已过期
                        clearInterval(qrCountdownInterval);
                        showQRExpired();
                        return;
                    }
                }, 1000); // 每秒检查一次过期状态
            }

            // 显示二维码过期覆盖层
            function showQRExpired() {
                // 停止状态轮询
                if (qrStatusInterval) {
                    clearInterval(qrStatusInterval);
                    qrStatusInterval = null;
                }

                // 显示过期覆盖层
                $('#qrExpiredOverlay').css('display', 'flex');

                // 更新状态文本
                $('#qrStatusText').text('二维码已过期，点击刷新');
            }

            // 清理二维码相关资源
            function cleanupQRCode() {
                if (qrStatusInterval) {
                    clearInterval(qrStatusInterval);
                    qrStatusInterval = null;
                }
                if (qrCountdownInterval) {
                    clearInterval(qrCountdownInterval);
                    qrCountdownInterval = null;
                }
                qrToken = null;
                qrExpireTime = null;
                $('#qrExpiredOverlay').hide();
            }

            $(document).ready(function () {
                const $loginForm = $('#_loginForm');
                const $qrLoginContainer = $('#qrLoginContainer');
                const $loginMethod = $('#loginMethod');
                const $qrIcon = $('#qr');
                const $qrImg = $qrIcon.find('img'); // 获取图标内的 img

                // 图标路径
                const qrIconSrc = '../../static/assets/img/login-qr.png';      // 二维码图标
                const accountIconSrc = '../../static/assets/img/login-amount.png'; // 返回账号图标

                // 初始化二维码区域的默认图片
                $('#qrCodeImage').attr('src', qrIconSrc);

                $qrIcon.click(function () {
                    if ($loginForm.is(':visible')) {
                        // 当前是账号登录 → 切换到二维码
                        $loginForm.hide();
                        $qrLoginContainer.show();
                        $loginMethod.text('扫码登录');

                        // 获取二维码
                        var clientId = $('input[name="clientId"]').val();
                        var redirectUri = $('input[name="redirectUri"]').val();
                        getQRCode(clientId, redirectUri);

                        // 切换图标为"返回账号"图标
                        $qrImg.attr('src', accountIconSrc);
                        $qrIcon.attr('title', '切换到账号登录');
                    } else {
                        // 当前是二维码登录 → 切回账号
                        $qrLoginContainer.hide();
                        $loginForm.show();
                        $loginMethod.text('账号登录');

                        // 清理二维码相关资源
                        cleanupQRCode();

                        // 切换图标为"二维码"图标
                        $qrImg.attr('src', qrIconSrc);
                        $qrIcon.attr('title', '切换到扫码登录');
                    }
                });

                // 点击"使用账号密码登录"也同步图标状态
                $('#backToAccount').click(function () {
                    if ($qrLoginContainer.is(':visible')) {
                        $qrLoginContainer.hide();
                        $loginForm.show();
                        $loginMethod.text('账号登录');

                        // 清理二维码相关资源
                        cleanupQRCode();

                        $qrImg.attr('src', qrIconSrc);
                        $qrIcon.attr('title', '切换到扫码登录');
                    }
                });

                // 绑定过期覆盖层点击事件
                $('#qrExpiredOverlay').click(function () {
                    refreshQRCode();
                });
            });

            $('#btn-login-dark').on('click', function (e) {
                $('body').attr('class', 'login-layout');
                $('#id-text2').attr('class', 'white');
                $('#id-company-text').attr('class', 'blue');

                e.preventDefault();
            });
            $('#btn-login-light').on('click', function (e) {
                $('body').attr('class', 'login-layout light-login');
                $('#id-text2').attr('class', 'grey');
                $('#id-company-text').attr('class', 'blue');

                e.preventDefault();
            });
            $('#btn-login-blur').on('click', function (e) {
                $('body').attr('class', 'login-layout blur-login');
                $('#id-text2').attr('class', 'white');
                $('#id-company-text').attr('class', 'light-blue');

                e.preventDefault();
            });

            $("#_loginButton").click(function () {
                if ($('#_loginForm').validate()) {
                    var username = $("#_username").val();
                    var password = $("#_password").val();

                    if ($('#_rememberMe:checked').length > 0) {
                        // 用户勾选了"记住密码"

                        // 加密密码
                        var encryptedPassword = encryptPassword(password);

                        if (encryptedPassword) {
                            // 设置Cookie，有效期30天，path设置为根路径
                            $.cookie('_username', username, { expires: 30, path: '/' });
                            $.cookie('_password', encryptedPassword, { expires: 30, path: '/' });
                            console.log('已保存用户名和加密密码到Cookie:', username); // 调试信息
                        } else {
                            console.error('密码加密失败，仅保存用户名'); // 调试信息
                            $.cookie('_username', username, { expires: 30, path: '/' });
                            $.removeCookie('_password', { path: '/' });
                        }
                    }
                    else {
                        // 用户没有勾选"记住密码"，删除所有保存的Cookie
                        $.removeCookie('_username', { path: '/' });
                        $.removeCookie('_password', { path: '/' });
                        console.log('未勾选记住密码，已删除所有保存的Cookie'); // 调试信息
                    }

                    $('#_loginForm').submit();
                }
            });

            // 回车绑定
            $(".form-data").bind('keypress', function (event) {
                if (event.keyCode == "13") {
                    event.preventDefault();
                    $("#_loginButton").click();
                }
            });

            // ==================== 忘记密码功能 ====================

            // 打开忘记密码模态框
            $('#_forgotPassword').click(function () {
                $('#forgotPasswordModal').css('display', 'flex');
                // 重置表单
                resetForgotPasswordForm();
            });

            // 关闭模态框函数
            function closeForgotPasswordModal() {
                $('#forgotPasswordModal').hide();
                resetForgotPasswordForm();
            }

            // 重置表单函数
            function resetForgotPasswordForm() {
                // 清空所有输入框
                $('#forgotName').val('');
                $('#forgotIdNumber').val('');
                $('#newPassword').val('');
                $('#confirmPassword').val('');

                // 显示第一步,隐藏第二步
                $('#step1Container').show();
                $('#step2Container').hide();
            }

            // 取消按钮 - 第一步
            $('#cancelStep1Btn').click(function () {
                closeForgotPasswordModal();
            });

            // 取消按钮 - 第二步
            $('#cancelStep2Btn').click(function () {
                closeForgotPasswordModal();
            });

            // 点击模态框外部关闭
            $('#forgotPasswordModal').click(function (e) {
                if (e.target.id === 'forgotPasswordModal') {
                    closeForgotPasswordModal();
                }
            });

            // 验证身份按钮
            $('#verifyIdentityBtn').click(function () {
                var name = $('#forgotName').val().trim();
                var idNumber = $('#forgotIdNumber').val().trim();

                // 前端验证
                if (!name) {
                    alert('请输入姓名');
                    return;
                }
                if (!idNumber) {
                    alert('请输入身份证号码');
                    return;
                }

                // 身份证号码格式验证
                var idNumberPattern = /^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dXx]$/;
                var idNumberPattern15 = /^[1-9]\d{5}\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}$/;

                if (!idNumberPattern.test(idNumber) && !idNumberPattern15.test(idNumber)) {
                    alert('身份证号码格式不正确');
                    return;
                }

                // 禁用按钮,防止重复提交
                $('#verifyIdentityBtn').prop('disabled', true).text('验证中...');

                // 发送AJAX请求验证身份
                $.ajax({
                    url: '${request.contextPath}/sso/forgot-password/verify',
                    method: 'POST',
                    data: {
                        name: name,
                        idNumber: idNumber
                    },
                    success: function (response) {
                        console.log('验证身份响应:', response);

                        if (response.code === 1) {
                            // 验证成功,显示第二步
                            $('#step1Container').hide();
                            $('#step2Container').show();
                        } else {
                            alert(response.message || '身份验证失败');
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('验证身份失败:', xhr, status, error);
                        alert('验证失败,请稍后重试');
                    },
                    complete: function () {
                        // 恢复按钮状态
                        $('#verifyIdentityBtn').prop('disabled', false).text('验证身份');
                    }
                });
            });

            // 确认修改密码按钮
            $('#resetPasswordBtn').click(function () {
                var name = $('#forgotName').val().trim();
                var idNumber = $('#forgotIdNumber').val().trim();
                var newPassword = $('#newPassword').val();
                var confirmPassword = $('#confirmPassword').val();

                // 前端验证
                if (!newPassword) {
                    alert('请输入新密码');
                    return;
                }
                if (newPassword.length < 6) {
                    alert('密码长度不能少于6位');
                    return;
                }
                if (newPassword.length > 16) {
                    alert('密码长度不能超过16位');
                    return;
                }
                if (!confirmPassword) {
                    alert('请确认新密码');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    alert('两次输入的密码不一致');
                    return;
                }

                // 禁用按钮,防止重复提交
                $('#resetPasswordBtn').prop('disabled', true).text('修改中...');

                // 发送AJAX请求重置密码
                $.ajax({
                    url: '${request.contextPath}/sso/forgot-password/reset',
                    method: 'POST',
                    data: {
                        name: name,
                        idNumber: idNumber,
                        newPassword: newPassword
                    },
                    success: function (response) {
                        console.log('重置密码响应:', response);

                        if (response.code === 1) {
                            alert('密码重置成功!请使用新密码登录');
                            closeForgotPasswordModal();
                            // 可选:自动填充用户名
                            // $('#_username').val(name);
                        } else {
                            alert(response.message || '密码重置失败');
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('重置密码失败:', xhr, status, error);
                        alert('重置失败,请稍后重试');
                    },
                    complete: function () {
                        // 恢复按钮状态
                        $('#resetPasswordBtn').prop('disabled', false).text('确认修改');
                    }
                });
            });

            // 回车键支持 - 第一步
            $('#forgotName, #forgotIdNumber').keypress(function (e) {
                if (e.keyCode === 13) {
                    e.preventDefault();
                    $('#verifyIdentityBtn').click();
                }
            });

            // 回车键支持 - 第二步
            $('#newPassword, #confirmPassword').keypress(function (e) {
                if (e.keyCode === 13) {
                    e.preventDefault();
                    $('#resetPasswordBtn').click();
                }
            });
        });
    </script>
</body>

</html>
