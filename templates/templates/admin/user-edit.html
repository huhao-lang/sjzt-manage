			<div class="form-group">
				<label for="_officeId" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>机构</label>

				<div class="col-sm-3">
					<select id="_officeId" name="officeId" class="form-control help-validate" required="true">
						<option value="">请选择</option>
						<#list officeList as item>
							<option value="${item.id}" <#if user.officeId?? && user.officeId == item.id>selected="selected"</#if>>${item.name}</option>
						</#list>
					</select>
				</div>
			</div>

			<div class="form-group">
				<label for="_posts" class="col-sm-3 control-label no-padding-right">职位</label>

				<div class="col-sm-6">
					<div class="clearfix help-validate">
						<input id="_posts" name="posts" type="text" value="${user.posts!}" class="form-data col-xs-10 col-sm-5" placeholder="名称"
							   maxlength="50"/>
					</div>
				</div>

			</div>


			<div class="form-group">
				<label for="_name" class="col-sm-3 control-label no-padding-right">姓名</label>

				<div class="col-sm-6">
					<div class="clearfix help-validate">
						<input id="_name" name="name" type="text" value="${user.name!}" class="form-data col-xs-10 col-sm-5" placeholder="名称"
							maxlength="50"/>
					</div>
				</div>

			</div>

			<div class="form-group">
				<label for="_gender" class="col-sm-3 control-label no-padding-right">性别</label>

				<div class="col-sm-9">
					<div class="clearfix help-validate">
						<label class="line-height-1 blue">
							<input name="gender" value="男" type="radio" class="ace" <#if (user.gender!"") != '女'>checked="checked"</#if>/>
							<span class="lbl"> 男</span>
						</label>
						&nbsp; &nbsp;
						<label class="line-height-1 blue">
							<input name="gender" value="女" type="radio" class="ace" <#if (user.gender!"") == '女'>checked="checked"</#if>/>
							<span class="lbl"> 女</span>
						</label>
					</div>
				</div>
			</div>

			<div class="form-group">
				<label for="_phone" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>手机号码</label>

				<div class="col-sm-6">
					<div class="clearfix help-validate">
						<input id="_phone" name="phone" type="text" value="${(user.phone?replace(',', ''))!}" class="form-data col-xs-10 col-sm-5" placeholder="手机号码"
							   maxlength="11" required="true" pattern="^1[3-9]\d{9}$"/>
					</div>
				</div>
			</div>

			<div class="form-group">
				<label for="_idNumber" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>身份证号码</label>

				<div class="col-sm-6">
					<div class="clearfix help-validate">
						<input id="_idNumber" name="idNumber" type="text" value="${(user.idNumber?replace(',', ''))!}" class="form-data col-xs-10 col-sm-5" placeholder="身份证号码"
							   maxlength="18" required="true" pattern="^[1-9]\d{5}(18|19|20)\d{2}((0[1-9])|(1[0-2]))(([0-2][1-9])|10|20|30|31)\d{3}[0-9Xx]$"/>
					</div>
				</div>
			</div>

			<div class="form-group">
				<label for="_jobGrade" class="col-sm-3 control-label no-padding-right">职级</label>

				<div class="col-sm-6">
					<div class="clearfix help-validate">
						<input id="_jobGrade" name="jobGrade" type="text" value="${user.jobGrade!}" class="form-data col-xs-10 col-sm-5" placeholder="职级"
							   maxlength="50"/>
					</div>
				</div>
			</div>

			<div class="form-group">
				<label for="_account" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>登录名</label>

				<div class="col-sm-9">
					<div class="input-medium help-validate">
						<div class="input-group">
							<input id="_account" name="account" type="text" value="${user.account!}" class="form-data"
								ajax="{url : '${request.contextPath}/admin/user/validate-account', dataId : '_editForm'}"
								required="true" minlength = '4' maxlength = '64'/>
							<span class="input-group-addon">
								<i class="ace-icon fa fa-user"></i>
							</span>
						</div>
					</div>
				</div>

			</div>

			<div class="form-group">
				<label for="_password" class="col-sm-3 control-label no-padding-right">${user.id?? ? string('','<span class="form-star">*</span>')}密码</label>

				<div class="col-sm-9">
					<div class="input-medium help-validate">
						<div class="input-group">
							<input id="_password" name="password" type="password" value="" class="form-data"
								${user.id?? ? string('data-rel="tooltip" title="不修改请留空"','')}
								${user.id?? ? string('','required="true"')}
								minlength = '6' maxlength = '16'/>
							<span class="input-group-addon">
								<i class="ace-icon fa fa-lock"></i>
							</span>
						</div>
					</div>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-xs-12 col-sm-3 no-padding-right"><span class="form-star">*</span>是否启用</label>

				<div class="col-xs-12 col-sm-9">
					<div class="clearfix help-validate">
						<div>
							<label class="line-height-1 blue">
								<input name="isEnable" value="true" type="radio" class="ace" ${(user.isEnable?? && user.isEnable) ? string('checked="checked"','')}/>
								<span class="lbl"> 是</span>
							</label>
						</div>

						<div>
							<label class="line-height-1 blue">
								<input name="isEnable" value="false" type="radio" class="ace" ${(user.isEnable?? && user.isEnable) ? string('','checked="checked"')}/>
								<span class="lbl"> 否</span>
							</label>
						</div>
					</div>
				</div>
			</div>

			<div class="clearfix form-actions">
				<div class="col-md-offset-3 col-md-9">
					<button id="_submit" type="button" class="btn btn-info" data-loading-text="正在提交...">
						<i class="ace-icon fa fa-check bigger-110"></i>
						提交
					</button>

					&nbsp; &nbsp; &nbsp;
					<button id="_cancle" class="btn" type="reset">
						<i class="ace-icon fa  fa-times bigger-110"></i>
						取消
					</button>
				</div>
			</div>
		</form>

	</div>
</div>

<script type="text/javascript">
	$('.page-content-area').ace_ajax('loadScripts', scripts, function() {
		jQuery(function($) {
			//焦点
			$("#_account").focus();

			//帮助查看
			$('[data-rel=tooltip]').tooltip({container:'body'});

			/* 头像功能 - 预留功能，暂时注释
			// 文件选择后自动上传
			$("#_avatarFile").change(function(){
				var fileInput = this;
				if(fileInput.files.length === 0) {
					return;
				}
				
				var file = fileInput.files[0];

					return;
				}
				
				var formData = new FormData();
				formData.append('file', file);
				
				// 显示上传中状态
				$("#_uploadAvatar").button('loading');
				
				$.ajax({
					url: "${request.contextPath}/file/upload",
					type: 'POST',
					data: formData,
					processData: false,
					contentType: false,
					success: function(d) {
						$("#_uploadAvatar").button('reset');
						if(d && d.code == 1) {
							// 使用previewFileUrl字段
							var avatarUrl = d.data.previewFileUrl || d.data;
							$("#_avatar").val(avatarUrl);
							$("#_avatarPreview").attr('src', avatarUrl).show();
							$("#_removeAvatar").show();
							$.gritter.add({text: '头像上传成功'});
						} else {
							$.gritter.add({text: d.message || '头像上传失败'});
							$(fileInput).val('');
						}
					},
					error: function() {
						$("#_uploadAvatar").button('reset');
						$.gritter.add({text: '头像上传失败'});
						$(fileInput).val('');
					}
				});
			});

			// 点击上传按钮触发文件选择
			$("#_uploadAvatar").click(function(){
				$("#_avatarFile").click();
			});

			// 删除头像
			$("#_removeAvatar").click(function(){
				$("#_avatar").val('');
				$("#_avatarPreview").attr('src', '').hide();
				$("#_avatarFile").val('');
				$("#_removeAvatar").hide();
				$.gritter.add({text: '头像已删除'});
			});
			*/

			// 提交
			$("#_submit").click(function(){
				if($('#_editForm').validate()){
					var btn = $(this);
					btn.button('loading');
					$.post("${request.contextPath}/admin/user/save", $.formJson('_editForm'),function(d) {
						if(d){
							btn.button('reset');
							if(d.code == 1){
								$.aceRedirect("${request.contextPath}/admin/user");
							}
							else {
								$.gritter.add({text: d.message});
							}
						}
			        },'json');
				}
			});

			// 取消
			$("#_cancle").click(function(){
				$.aceRedirect("${request.contextPath}/admin/user");
			});

			// 回车绑定
			$(".form-data").bind('keypress',function(event){
                if(event.keyCode == "13"){
                	event.preventDefault();
                	$("#_submit").click();
                }
            });
		});
	});
</script>
