<title>机构</title>
<#include "../common/common.html" />

<div class="row">
	<div class="col-xs-12">
		<div class="row">
			<div class="col-xs-12">
				<form id="_form" />
				<div>
					<div class="dataTables_wrapper form-inline no-footer">
						<table id="_table" class="table table-striped table-bordered table-hover dataTable no-footer">
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- 引入树形表格插件 -->
<script type="text/javascript" src="${request.contextPath}/custom/jquery.tree-table.js?v=20251217"></script>

<script type="text/javascript">
	$('.page-content-area').ace_ajax('loadScripts', scripts, function () {
		jQuery(function ($) {
			// 配置对象
			var tableConfig = {
				url: "${request.contextPath}/admin/office/tree",
				formId: "_form",
				checkbox: { hide: false },
				index: { hide: true, title: "序号", align: 'center' },
				tools: [
					{
						text: '新增', clazz: 'btn-info', icon: 'fa fa-plus-circle blue', permission: '/admin/office/edit', handler: function () {
							$.aceRedirect("${request.contextPath}/admin/office/edit");
						}
					},
					{
						text: '禁用', clazz: 'btn-warning', icon: 'fa fa-lock orange', permission: '/admin/office/enable', handler: function () {
							ajaxEnable(false);
						}
					},
					{
						text: '启用', clazz: 'btn-success', icon: 'fa fa-unlock green', permission: '/admin/office/enable', handler: function () {
							ajaxEnable(true);
						}
					},
					{
						text: '删除', clazz: 'btn-danger', icon: 'fa fa-trash-o red', permission: '/admin/office/delete', handler: function () {
							ajaxDelete();
						}
					}
				],
				columns: [
					{ field: 'id', hide: true },
					{ field: 'isEnable', hide: true },
					{ field: 'name', title: '名称', align: 'left' },
					{ field: 'sort', title: '排序', mobileHide: true },
					{
						field: 'isEnableStr', title: '是否启用', replace: function (d) {
							if (d.isEnable)
								return "<span class='label label-sm label-success'>是</span>";
							else
								return "<span class='label label-sm label-warning'>否</span>";
						}
					}
				],
				operate: [
					{
						text: '修改', clazz: 'blue', icon: 'fa fa-pencil', permission: '/admin/office/edit', handler: function (d, i) {
							$.aceRedirect("${request.contextPath}/admin/office/edit?id=" + d.id);
						}
					},
					{
						text: '禁用', clazz: 'orange', icon: 'fa fa-lock', permission: '/admin/office/enable',
						handler: function (d) {
							ajaxEnableSingle(d.id, false);
						},
						show: function (d) {
							return d.isEnable;
						}
					},
					{
						text: '启用', clazz: 'green', icon: 'fa fa-unlock', permission: '/admin/office/enable',
						handler: function (d) {
							ajaxEnableSingle(d.id, true);
						},
						show: function (d) {
							return !d.isEnable;
						}
					},
					{
						text: '删除', clazz: 'red', icon: 'fa fa-trash-o', permission: '/admin/office/delete', handler: function (d, i) {
							ajaxDeleteSingle(d.id);
						}
					}
				],
				after: function () {
					// 权限处理
					$.permission();
				},
				pagination: { hide: true },
				tree: {
					enable: true,
					idField: 'id',
					parentIdField: 'parentId',
					treeField: 'name',
					expandLevel: -1  // -1 表示全部展开
				}
			};

			var treeData = [];  // 存储树形数据
			var $table = $("#_table");

			// 初始化树形表格 - 保存返回的对象
			var treeTable = $table.treeTable({
				idField: 'id',
				parentIdField: 'parentId',
				treeField: 'name',
				expandLevel: -1,  // -1 表示全部展开
				indent: 20,
				expandIcon: 'fa-angle-right',
				collapseIcon: 'fa-angle-down'
			});

			// 创建工具栏
			function createTools() {
				var html = '<div class="row">';
				html += '<div class="col-xs-12">';
				html += '<div id="_table_length" class="dataTables_length">';

				$.each(tableConfig.tools, function (i, button) {
					var permission = button.permission ? 'permission="' + button.permission + '"' : '';
					html += '<button id="_tr' + i + '" class="btn btn-sm btn-white ' + button.clazz + ' btn-bold" ' + permission + '>';
					html += '<i class="ace-icon ' + button.icon + ' bigger-120"></i>';
					html += button.text;
					html += '</button>';
				});

				html += '</div>';
				html += '</div>';
				html += '</div>';

				$table.before(html);

				// 绑定工具栏事件
				$.each(tableConfig.tools, function (i, button) {
					$('#_tr' + i).on('click', function () {
						if (button.handler) {
							button.handler();
						}
					});
				});
			}

			// 创建表头
			function createHeader() {
				var $thead = $('<thead></thead>');
				var $tr = $('<tr></tr>');

				// 复选框列
				if (!tableConfig.checkbox.hide) {
					var $th = $('<th class="center"></th>');
					$th.html('<label class="pos-rel"><input type="checkbox" class="ace" /><span class="lbl"></span></label>');
					$tr.append($th);
				}

				// 序号列
				if (!tableConfig.index.hide) {
					var $th = $('<th></th>').text(tableConfig.index.title);
					if (tableConfig.index.align) {
						$th.addClass('text-' + tableConfig.index.align);
					}
					$tr.append($th);
				}

				// 数据列
				$.each(tableConfig.columns, function (i, column) {
					if (!column.hide) {
						var $th = $('<th></th>').text(column.title);
						if (column.align) {
							$th.addClass('text-' + column.align);
						}
						if (column.mobileHide) {
							$th.addClass('hidden-480');
						}
						$tr.append($th);
					}
				});

				// 操作列
				if (tableConfig.operate.length > 0) {
					$tr.append('<th></th>');
				}

				$thead.append($tr);
				$table.append($thead);

				// 创建 tbody 元素
				var $tbody = $('<tbody></tbody>');
				$table.append($tbody);
			}

			// 加载数据
			function loadData() {
				$.ajax({
					type: "GET",
					url: tableConfig.url,
					dataType: "json",
					success: function (response) {
						if (response && response.data) {
							treeData = response.data;
							treeTable.renderTree(treeData, tableConfig);
						}
					},
					error: function (xhr, status, error) {
						$.gritter.add({ text: '加载数据失败' });
					}
				});
			}

			// 获取选中的ID列表
			function getSelectedIds() {
				var ids = [];
				$table.find('tbody input[type=checkbox]:checked').each(function () {
					var $tr = $(this).closest('tr');
					ids.push($tr.data('id'));
				});
				return ids.join(',');
			}

			// 批量启用/禁用
			function ajaxEnable(isEnable) {
				var ids = getSelectedIds();
				if (!ids) {
					$.gritter.add({ text: '请至少选择一条记录' });
					return;
				}

				$.ajax({
					type: "POST",
					url: "${request.contextPath}/admin/office/enable",
					data: { ids: ids, isEnable: isEnable },
					dataType: "json",
					success: function (response) {
						$.gritter.add({ text: isEnable ? '启用成功' : '禁用成功' });
						loadData();
					},
					error: function () {
						$.gritter.add({ text: '操作失败' });
					}
				});
			}

			// 单个启用/禁用
			function ajaxEnableSingle(id, isEnable) {
				$.ajax({
					type: "POST",
					url: "${request.contextPath}/admin/office/enable",
					data: { ids: id, isEnable: isEnable },
					dataType: "json",
					success: function (response) {
						$.gritter.add({ text: isEnable ? '启用成功' : '禁用成功' });
						loadData();
					},
					error: function () {
						$.gritter.add({ text: '操作失败' });
					}
				});
			}

			// 批量删除
			function ajaxDelete() {
				var ids = getSelectedIds();
				if (!ids) {
					$.gritter.add({ text: '请至少选择一条记录' });
					return;
				}

				bootbox.confirm("确认删除?", function (result) {
					if (result) {
						$.ajax({
							type: "POST",
							url: "${request.contextPath}/admin/office/delete",
							data: { ids: ids },
							dataType: "json",
							success: function (response) {
								$.gritter.add({ text: '删除成功' });
								loadData();
							},
							error: function () {
								$.gritter.add({ text: '删除失败' });
							}
						});
					}
				});
			}

			// 单个删除
			function ajaxDeleteSingle(id) {
				bootbox.confirm("确认删除?", function (result) {
					if (result) {
						$.ajax({
							type: "POST",
							url: "${request.contextPath}/admin/office/delete",
							data: { ids: id },
							dataType: "json",
							success: function (response) {
								$.gritter.add({ text: '删除成功' });
								loadData();
							},
							error: function () {
								$.gritter.add({ text: '删除失败' });
							}
						});
					}
				});
			}

			// 初始化
			createTools();
			createHeader();
			loadData();
		});
	});
</script>
